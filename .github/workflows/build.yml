name: Build Linux OpenCL Binary

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install OpenCL & Curl Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ocl-icd-opencl-dev opencl-headers libcurl4-openssl-dev

    - name: Build Binary
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Verify Binary
      run: |
        ls -la profanity.x64

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: profanity.x64
        path: profanity.x64

    - name: Release Binary on Tag
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: profanity.x64
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
